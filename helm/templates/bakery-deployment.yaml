{{- if .Values.bakery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bakery.fullname" . }}
  labels:
    {{- include "bakery.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.bakery.replicaCount }}
  selector:
    matchLabels:
      {{- include "bakery.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "bakery.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- include "bakery.logGroupLabel" . | nindent 8 }}
        {{- include "bakery.logRoleApi" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "bakery.pullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "bakery.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "bakery.waitForDbInitContainer" . | nindent 8 }}
      containers:
        - name: bakery
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "bakery.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.bakery.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bakery.service.port }}
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: {{ .Values.bakery.config.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.bakery.config.logLevel | quote }}
            - name: BAKERY_APP_VERSION
              value: {{ include "bakery.imageVersion" . | quote }}
            - name: TICKETING_DRY_RUN
              value: {{ .Values.bakery.config.ticketingDryRun | quote }}
            - name: BAKERY_ACTIVE_PROVIDER
              value: {{ .Values.bakery.config.activeProvider | default "rackspace_core" | quote }}
            - name: DATABASE_HOST
              value: {{ include "bakery.dbHost" . }}
            - name: DATABASE_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: {{ .Values.bakery.database.name | quote }}
            - name: DATABASE_USER
              value: {{ .Values.bakery.database.user.name | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bakery.dbSecretName" . }}
                  key: {{ include "bakery.dbSecretKey" . }}
            - name: DATABASE_POOL_SIZE
              value: {{ .Values.bakery.config.databasePoolSize | quote }}
            - name: DATABASE_POOL_MAX_OVERFLOW
              value: {{ .Values.bakery.config.databasePoolMaxOverflow | quote }}
            - name: DATABASE_POOL_TIMEOUT
              value: {{ .Values.bakery.config.databasePoolTimeout | quote }}
            - name: MESSAGE_RETENTION_HOURS
              value: {{ .Values.bakery.config.messageRetentionHours | quote }}
            - name: MAX_MESSAGES_PER_POLL
              value: {{ .Values.bakery.config.maxMessagesPerPoll | quote }}
            - name: MIXER_TIMEOUT_SEC
              value: {{ .Values.bakery.config.mixerTimeoutSec | quote }}
            - name: MIXER_MAX_RETRIES
              value: {{ .Values.bakery.config.mixerMaxRetries | quote }}
            - name: BAKERY_AUTH_ENABLED
              value: {{ .Values.bakery.auth.enabled | quote }}
            - name: BAKERY_AUTH_MODE
              value: {{ .Values.bakery.auth.mode | quote }}
            - name: BAKERY_OPERATOR_AUTH_ENABLED
              value: {{ .Values.bakery.operatorAuth.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_SESSION_TIMEOUT
              value: {{ .Values.bakery.operatorAuth.sessionTimeout | quote }}
            - name: BAKERY_OPERATOR_AUTH_OIDC_STATE_TTL
              value: {{ .Values.bakery.operatorAuth.oidcStateTtl | quote }}
            - name: BAKERY_OPERATOR_AUTH_RBAC_ENABLED
              value: {{ .Values.bakery.operatorAuth.rbacEnabled | quote }}
            - name: BAKERY_UI_PUBLIC_URL
              value: {{ .Values.bakery.ui.publicUrl | quote }}
            {{- if .Values.bakery.operatorAuth.serviceToken.existingSecret }}
            - name: BAKERY_OPERATOR_AUTH_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.serviceToken.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.serviceToken.secretKeys.token }}
                  optional: true
            {{- end }}
            - name: BAKERY_OPERATOR_AUTH_LOCAL_ENABLED
              value: {{ .Values.bakery.operatorAuth.local.enabled | quote }}
            {{- if .Values.bakery.operatorAuth.local.existingSecret }}
            - name: BAKERY_OPERATOR_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.local.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.local.secretKeys.username }}
                  optional: true
            - name: BAKERY_OPERATOR_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.local.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.local.secretKeys.password }}
                  optional: true
            {{- end }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_ENABLED
              value: {{ .Values.bakery.operatorAuth.auth0.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_DOMAIN
              value: {{ .Values.bakery.operatorAuth.auth0.shared.domain | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_AUDIENCE
              value: {{ .Values.bakery.operatorAuth.auth0.shared.audience | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_SCOPE
              value: {{ .Values.bakery.operatorAuth.auth0.shared.scope | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_ORGANIZATION
              value: {{ .Values.bakery.operatorAuth.auth0.shared.organization | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_CONNECTION
              value: {{ .Values.bakery.operatorAuth.auth0.shared.connection | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_USERNAME_CLAIM
              value: {{ .Values.bakery.operatorAuth.auth0.shared.usernameClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_DISPLAY_NAME_CLAIM
              value: {{ .Values.bakery.operatorAuth.auth0.shared.displayNameClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_GROUPS_CLAIM
              value: {{ .Values.bakery.operatorAuth.auth0.shared.groupsClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_SUBJECT_CLAIM
              value: {{ .Values.bakery.operatorAuth.auth0.shared.subjectClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_UI_ENABLED
              value: {{ .Values.bakery.operatorAuth.auth0.ui.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_UI_CLIENT_ID
              value: {{ .Values.bakery.operatorAuth.auth0.ui.clientId | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_UI_CALLBACK_URL
              value: {{ .Values.bakery.operatorAuth.auth0.ui.callbackUrl | quote }}
            {{- if .Values.bakery.operatorAuth.auth0.ui.existingSecret }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.auth0.ui.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.auth0.ui.secretKeys.clientSecret }}
                  optional: true
            {{- end }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_CLI_ENABLED
              value: {{ .Values.bakery.operatorAuth.auth0.cli.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_CLI_CLIENT_ID
              value: {{ .Values.bakery.operatorAuth.auth0.cli.clientId | quote }}
            {{- if .Values.bakery.operatorAuth.auth0.cli.existingSecret }}
            - name: BAKERY_OPERATOR_AUTH_AUTH0_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.auth0.cli.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.auth0.cli.secretKeys.clientSecret }}
                  optional: true
            {{- end }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_ENABLED
              value: {{ .Values.bakery.operatorAuth.azureAd.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_TENANT
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.tenant | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_AUDIENCE
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.audience | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_SCOPE
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.scope | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_USERNAME_CLAIM
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.usernameClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_DISPLAY_NAME_CLAIM
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.displayNameClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_GROUPS_CLAIM
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.groupsClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_SUBJECT_CLAIM
              value: {{ .Values.bakery.operatorAuth.azureAd.shared.subjectClaim | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_UI_ENABLED
              value: {{ .Values.bakery.operatorAuth.azureAd.ui.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_UI_CLIENT_ID
              value: {{ .Values.bakery.operatorAuth.azureAd.ui.clientId | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_UI_CALLBACK_URL
              value: {{ .Values.bakery.operatorAuth.azureAd.ui.callbackUrl | quote }}
            {{- if .Values.bakery.operatorAuth.azureAd.ui.existingSecret }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.operatorAuth.azureAd.ui.existingSecret }}
                  key: {{ .Values.bakery.operatorAuth.azureAd.ui.secretKeys.clientSecret }}
                  optional: true
            {{- end }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_CLI_ENABLED
              value: {{ .Values.bakery.operatorAuth.azureAd.cli.enabled | quote }}
            - name: BAKERY_OPERATOR_AUTH_AZURE_AD_CLI_CLIENT_ID
              value: {{ .Values.bakery.operatorAuth.azureAd.cli.clientId | quote }}
            - name: BAKERY_HMAC_TIMESTAMP_SKEW_SEC
              value: {{ .Values.bakery.auth.hmac.timestampSkewSec | quote }}
            {{- $bakeryAuthSecretName := .Values.bakery.auth.existingSecret | default (include "bakery.secretName" .) }}
            - name: BAKERY_HMAC_ACTIVE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $bakeryAuthSecretName }}
                  key: {{ .Values.bakery.auth.secretKeys.activeKeyId }}
                  optional: true
            - name: BAKERY_HMAC_ACTIVE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bakeryAuthSecretName }}
                  key: {{ .Values.bakery.auth.secretKeys.activeKey }}
                  optional: true
            - name: BAKERY_HMAC_NEXT_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $bakeryAuthSecretName }}
                  key: {{ .Values.bakery.auth.secretKeys.nextKeyId }}
                  optional: true
            - name: BAKERY_HMAC_NEXT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bakeryAuthSecretName }}
                  key: {{ .Values.bakery.auth.secretKeys.nextKey }}
                  optional: true
            - name: BAKERY_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $bakeryAuthSecretName }}
                  key: {{ .Values.bakery.auth.secretKeys.monitorEncryptionKey }}
                  optional: true
            - name: BAKERY_MONITOR_DEFAULT_KEY_ID
              value: {{ .Values.bakery.monitoring.defaultKeyId | quote }}
            - name: BAKERY_MONITOR_BOOTSTRAP_KEY_ID
              value: {{ .Values.bakery.monitoring.bootstrapKeyId | quote }}
            - name: BAKERY_MONITOR_HEARTBEAT_INTERVAL_SEC
              value: {{ .Values.bakery.monitoring.heartbeatIntervalSec | quote }}
            - name: BAKERY_MONITOR_MISS_THRESHOLD
              value: {{ .Values.bakery.monitoring.missThreshold | quote }}
            - name: BAKERY_MONITOR_SWEEP_INTERVAL_SEC
              value: {{ .Values.bakery.monitoring.sweepIntervalSec | quote }}
            - name: BAKERY_WORKER_POLL_INTERVAL_SEC
              value: {{ .Values.bakery.worker.pollIntervalSec | quote }}
            - name: BAKERY_WORKER_BATCH_SIZE
              value: {{ .Values.bakery.worker.batchSize | quote }}
            - name: BAKERY_WORKER_MAX_ATTEMPTS
              value: {{ .Values.bakery.worker.maxAttempts | quote }}
            - name: BAKERY_WORKER_BACKOFF_BASE_SEC
              value: {{ .Values.bakery.worker.backoffBaseSec | quote }}
            - name: BAKERY_WORKER_BACKOFF_MAX_SEC
              value: {{ .Values.bakery.worker.backoffMaxSec | quote }}
            {{- if .Values.bakery.servicenow.existingSecret }}
            - name: SERVICENOW_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.servicenow.existingSecret }}
                  key: {{ .Values.bakery.servicenow.secretKeys.url }}
                  optional: true
            - name: SERVICENOW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.servicenow.existingSecret }}
                  key: {{ .Values.bakery.servicenow.secretKeys.username }}
                  optional: true
            - name: SERVICENOW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.servicenow.existingSecret }}
                  key: {{ .Values.bakery.servicenow.secretKeys.password }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.jira.existingSecret }}
            - name: JIRA_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.jira.existingSecret }}
                  key: {{ .Values.bakery.jira.secretKeys.url }}
                  optional: true
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.jira.existingSecret }}
                  key: {{ .Values.bakery.jira.secretKeys.username }}
                  optional: true
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.jira.existingSecret }}
                  key: {{ .Values.bakery.jira.secretKeys.apiToken }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.github.existingSecret }}
                  key: {{ .Values.bakery.github.secretKeys.token }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.pagerduty.existingSecret }}
            - name: PAGERDUTY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.pagerduty.existingSecret }}
                  key: {{ .Values.bakery.pagerduty.secretKeys.apiKey }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.teams.existingSecret }}
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.teams.existingSecret }}
                  key: {{ .Values.bakery.teams.secretKeys.webhookUrl }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.discord.existingSecret }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.discord.existingSecret }}
                  key: {{ .Values.bakery.discord.secretKeys.webhookUrl }}
                  optional: true
            {{- end }}
            {{- if .Values.bakery.rackspaceCore.existingSecret }}
            - name: RACKSPACE_CORE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.rackspaceCore.existingSecret }}
                  key: {{ .Values.bakery.rackspaceCore.secretKeys.url }}
                  optional: true
            - name: RACKSPACE_CORE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.rackspaceCore.existingSecret }}
                  key: {{ .Values.bakery.rackspaceCore.secretKeys.username }}
                  optional: true
            - name: RACKSPACE_CORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bakery.rackspaceCore.existingSecret }}
                  key: {{ .Values.bakery.rackspaceCore.secretKeys.password }}
                  optional: true
            {{- end }}
            - name: RACKSPACE_CORE_DEFAULT_QUEUE
              value: {{ .Values.bakery.rackspaceCore.defaultQueue | quote }}
            - name: RACKSPACE_CORE_DEFAULT_SUBCATEGORY
              value: {{ .Values.bakery.rackspaceCore.defaultSubcategory | quote }}
            - name: RACKSPACE_CORE_VERIFY_SSL
              value: {{ .Values.bakery.rackspaceCore.verifySsl | quote }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.bakery.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.bakery.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.bakery.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.bakery.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: {{ .Values.bakery.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.bakery.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.bakery.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.bakery.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.bakery.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "bakery.podPlacement" . | nindent 6 }}
{{- end }}
