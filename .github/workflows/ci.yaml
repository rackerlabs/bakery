#
# CI workflow for PRs: lint, type-check, and unit tests.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.5.1 --verify=false

      - run: helm lint ./helm

      - run: helm unittest ./helm --file 'tests/unittest/*_test.yaml'

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: helm/chart-testing-action@v2.7.0

      - run: ct lint --charts helm --validate-maintainers=false --check-version-increment=false

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            dev-requirements.txt

      - run: pip install -e ".[dev]"

      - run: pre-commit run --all-files

      - run: mypy bakery shared

      - run: pytest -m "not integration" tests/ -v --cov=bakery --cov=shared --cov-report=xml
