suite: bakery-db-contract
templates:
  - templates/bakery-required.yaml
  - templates/bakery-mariadb.yaml
  - templates/bakery-deployment.yaml
  - templates/bakery-worker-deployment.yaml
  - templates/bakery-init-job.yaml
tests:
  - it: uses configured bakery database password secret key across api worker init and user resources
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.database.user.passwordSecret: external-bakery-db-user
      bakery.database.user.passwordSecretKey: db-pass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-bakery-db-user
                key: db-pass
        template: templates/bakery-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-bakery-db-user
                key: db-pass
        template: templates/bakery-worker-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-bakery-db-user
                key: db-pass
        template: templates/bakery-init-job.yaml
      - equal:
          path: spec.passwordSecretKeyRef.name
          value: external-bakery-db-user
        template: templates/bakery-mariadb.yaml
        documentIndex: 3
      - equal:
          path: spec.passwordSecretKeyRef.key
          value: db-pass
        template: templates/bakery-mariadb.yaml
        documentIndex: 3

  - it: renders dedicated bakery mariadb resources and standalone bakery db-init job
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      mariadbOperator.enabled: true
    asserts:
      - hasDocuments:
          count: 6
        template: templates/bakery-mariadb.yaml
      - hasDocuments:
          count: 1
        template: templates/bakery-init-job.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-bakery-db-init
        template: templates/bakery-init-job.yaml

  - it: does not render unsupported MariaDB podTemplate field
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      mariadbOperator.enabled: true
    asserts:
      - isNull:
          path: spec.podTemplate
        template: templates/bakery-mariadb.yaml
        documentIndex: 0

  - it: fails fast when bakery database createServer is disabled
    set:
      bakery.enabled: true
      bakery.worker.enabled: false
      bakery.database.createServer: false
    asserts:
      - failedTemplate:
          errorMessage: "bakery.database.createServer=false is not supported. Bakery requires an operator-managed MariaDB server."
        template: templates/bakery-required.yaml

  - it: fails fast when mariadb operator is disabled
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      mariadbOperator.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "bakery.database.createServer=true requires mariadbOperator.enabled=true"
        template: templates/bakery-required.yaml

  - it: uses bakery image digest across api worker and init job
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.image.repository: ghcr.io/example/bakery
      bakery.image.tag: ""
      bakery.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/bakery@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        template: templates/bakery-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/bakery@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        template: templates/bakery-worker-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/bakery@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        template: templates/bakery-init-job.yaml

  - it: falls back to chart appVersion when bakery tag and digest are unset
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.image.repository: ghcr.io/example/bakery
      bakery.image.tag: ""
      bakery.image.digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/bakery:0.1.19
        template: templates/bakery-deployment.yaml

  - it: reports Bakery version from the deployed Bakery image tag
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.image.tag: "0.1.10"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BAKERY_APP_VERSION
            value: "0.1.10"
        template: templates/bakery-deployment.yaml

  - it: injects rackspace core default queue and subcategory into the worker
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.rackspaceCore.defaultQueue: CloudBuilders Support
      bakery.rackspaceCore.defaultSubcategory: Monitoring
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RACKSPACE_CORE_DEFAULT_QUEUE
            value: CloudBuilders Support
        template: templates/bakery-worker-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RACKSPACE_CORE_DEFAULT_SUBCATEGORY
            value: Monitoring
        template: templates/bakery-worker-deployment.yaml

  - it: injects monitor registry secret and timing env vars into api and worker
    set:
      bakery.enabled: true
      bakery.database.createServer: true
      bakery.auth.existingSecret: external-bakery-auth
      bakery.monitoring.defaultKeyId: monitor-active
      bakery.monitoring.bootstrapKeyId: monitor-bootstrap
      bakery.monitoring.heartbeatIntervalSec: 30
      bakery.monitoring.missThreshold: 5
      bakery.monitoring.sweepIntervalSec: 7
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BAKERY_SECRET_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: external-bakery-auth
                key: monitor-encryption-key
                optional: true
        template: templates/bakery-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BAKERY_MONITOR_BOOTSTRAP_KEY_ID
            value: monitor-bootstrap
        template: templates/bakery-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BAKERY_MONITOR_SWEEP_INTERVAL_SEC
            value: "7"
        template: templates/bakery-worker-deployment.yaml
