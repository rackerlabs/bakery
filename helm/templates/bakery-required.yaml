{{- if .Values.bakery.enabled }}
{{- if not .Values.bakery.database.createServer }}
{{- fail "bakery.database.createServer=false is not supported. Bakery requires an operator-managed MariaDB server." -}}
{{- end }}
{{- if not .Values.mariadbOperator.enabled }}
{{- fail "bakery.database.createServer=true requires mariadbOperator.enabled=true" -}}
{{- end }}
{{- if or .Values.bakery.rackspaceCore.url .Values.bakery.rackspaceCore.username .Values.bakery.rackspaceCore.password }}
{{- fail "Rackspace Core direct values are disabled. Use bakery.rackspaceCore.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if or .Values.bakery.servicenow.url .Values.bakery.servicenow.username .Values.bakery.servicenow.password }}
{{- fail "ServiceNow direct values are disabled. Use bakery.servicenow.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if or .Values.bakery.jira.url .Values.bakery.jira.username .Values.bakery.jira.apiToken }}
{{- fail "Jira direct values are disabled. Use bakery.jira.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if .Values.bakery.github.token }}
{{- fail "GitHub direct values are disabled. Use bakery.github.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if .Values.bakery.pagerduty.apiKey }}
{{- fail "PagerDuty direct values are disabled. Use bakery.pagerduty.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if .Values.bakery.teams.webhookUrl }}
{{- fail "Teams direct values are disabled. Use bakery.teams.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if .Values.bakery.discord.webhookUrl }}
{{- fail "Discord direct values are disabled. Use bakery.discord.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if or .Values.bakery.auth.hmac.activeKeyId .Values.bakery.auth.hmac.activeKey .Values.bakery.auth.hmac.nextKeyId .Values.bakery.auth.hmac.nextKey }}
{{- fail "Bakery auth direct values are disabled. Use bakery.auth.existingSecret and install-bakery.sh secret provisioning." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.auth0.enabled (not .Values.bakery.operatorAuth.auth0.shared.domain) }}
{{- fail "bakery.operatorAuth.auth0.shared.domain is required when bakery.operatorAuth.auth0.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.auth0.enabled (not (or .Values.bakery.operatorAuth.auth0.ui.enabled .Values.bakery.operatorAuth.auth0.cli.enabled)) }}
{{- fail "bakery.operatorAuth.auth0.ui.enabled or bakery.operatorAuth.auth0.cli.enabled must be true when bakery.operatorAuth.auth0.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.auth0.enabled .Values.bakery.operatorAuth.auth0.ui.enabled (not .Values.bakery.operatorAuth.auth0.ui.clientId) }}
{{- fail "bakery.operatorAuth.auth0.ui.clientId is required when bakery.operatorAuth.auth0.ui.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.auth0.enabled .Values.bakery.operatorAuth.auth0.cli.enabled (not .Values.bakery.operatorAuth.auth0.cli.clientId) }}
{{- fail "bakery.operatorAuth.auth0.cli.clientId is required when bakery.operatorAuth.auth0.cli.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.azureAd.enabled (not .Values.bakery.operatorAuth.azureAd.shared.tenant) }}
{{- fail "bakery.operatorAuth.azureAd.shared.tenant is required when bakery.operatorAuth.azureAd.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.azureAd.enabled (not (or .Values.bakery.operatorAuth.azureAd.ui.enabled .Values.bakery.operatorAuth.azureAd.cli.enabled)) }}
{{- fail "bakery.operatorAuth.azureAd.ui.enabled or bakery.operatorAuth.azureAd.cli.enabled must be true when bakery.operatorAuth.azureAd.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.azureAd.enabled .Values.bakery.operatorAuth.azureAd.ui.enabled (not .Values.bakery.operatorAuth.azureAd.ui.clientId) }}
{{- fail "bakery.operatorAuth.azureAd.ui.clientId is required when bakery.operatorAuth.azureAd.ui.enabled=true." -}}
{{- end }}
{{- if and .Values.bakery.operatorAuth.azureAd.enabled .Values.bakery.operatorAuth.azureAd.cli.enabled (not .Values.bakery.operatorAuth.azureAd.cli.clientId) }}
{{- fail "bakery.operatorAuth.azureAd.cli.clientId is required when bakery.operatorAuth.azureAd.cli.enabled=true." -}}
{{- end }}
{{- $activeProvider := (.Values.bakery.config.activeProvider | default "rackspace_core") -}}
{{- if and (eq $activeProvider "rackspace_core") (not .Values.bakery.rackspaceCore.existingSecret) }}
{{- fail "bakery.rackspaceCore.existingSecret is required when bakery.config.activeProvider=rackspace_core. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "servicenow") (not .Values.bakery.servicenow.existingSecret) }}
{{- fail "bakery.servicenow.existingSecret is required when bakery.config.activeProvider=servicenow. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "jira") (not .Values.bakery.jira.existingSecret) }}
{{- fail "bakery.jira.existingSecret is required when bakery.config.activeProvider=jira. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "github") (not .Values.bakery.github.existingSecret) }}
{{- fail "bakery.github.existingSecret is required when bakery.config.activeProvider=github. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "pagerduty") (not .Values.bakery.pagerduty.existingSecret) }}
{{- fail "bakery.pagerduty.existingSecret is required when bakery.config.activeProvider=pagerduty. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "teams") (not .Values.bakery.teams.existingSecret) }}
{{- fail "bakery.teams.existingSecret is required when bakery.config.activeProvider=teams. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if and (eq $activeProvider "discord") (not .Values.bakery.discord.existingSecret) }}
{{- fail "bakery.discord.existingSecret is required when bakery.config.activeProvider=discord. Use install-bakery.sh to verify/create the secret." -}}
{{- end }}
{{- if .Values.bakery.gateway.enabled }}
{{- $bakeryGatewayProtocol := upper (default "HTTPS" .Values.bakery.gateway.listener.protocol) -}}
{{- $allowInsecureBakeryHttp := .Values.bakery.gateway.allowInsecureHttp | default false -}}
{{- if not .Values.bakery.gateway.gatewayName }}
{{- fail "bakery.gateway.gatewayName is required when bakery.gateway.enabled=true." -}}
{{- end }}
{{- if not .Values.bakery.gateway.listener.name }}
{{- fail "bakery.gateway.listener.name is required when bakery.gateway.enabled=true." -}}
{{- end }}
{{- if and (eq $bakeryGatewayProtocol "HTTPS") (not .Values.bakery.gateway.listener.tlsSecretName) }}
{{- fail "bakery.gateway.listener.tlsSecretName is required when bakery.gateway.listener.protocol=HTTPS." -}}
{{- end }}
{{- if and (eq $bakeryGatewayProtocol "HTTP") (not $allowInsecureBakeryHttp) }}
{{- fail "bakery.gateway.listener.protocol=HTTP is not allowed by default. Use HTTPS for external Bakery traffic, or set bakery.gateway.allowInsecureHttp=true only for isolated non-production environments." -}}
{{- end }}
{{- end }}
{{- if .Values.bakery.ui.gateway.enabled }}
{{- $uiGatewayProtocol := include "bakery.uiGatewayListenerProtocol" . -}}
{{- $allowInsecureUiHttp := .Values.bakery.ui.gateway.allowInsecureHttp | default false -}}
{{- if not .Values.bakery.ui.gateway.gatewayName }}
{{- fail "bakery.ui.gateway.gatewayName is required when bakery.ui.gateway.enabled=true." -}}
{{- end }}
{{- if not .Values.bakery.ui.gateway.listener.name }}
{{- fail "bakery.ui.gateway.listener.name is required when bakery.ui.gateway.enabled=true." -}}
{{- end }}
{{- if eq (len (.Values.bakery.ui.gateway.hostnames | default list)) 0 }}
{{- fail "bakery.ui.gateway.hostnames must include at least one hostname when bakery.ui.gateway.enabled=true." -}}
{{- end }}
{{- if not .Values.bakery.ui.publicUrl }}
{{- fail "bakery.ui.publicUrl is required when bakery.ui.gateway.enabled=true." -}}
{{- end }}
{{- if not .Values.bakery.ui.apiBaseUrl }}
{{- fail "bakery.ui.apiBaseUrl is required when bakery.ui.gateway.enabled=true." -}}
{{- end }}
{{- if and (eq $uiGatewayProtocol "HTTPS") (not .Values.bakery.ui.gateway.listener.tlsSecretName) }}
{{- fail "bakery.ui.gateway.listener.tlsSecretName is required when bakery.ui.gateway.listener.protocol=HTTPS." -}}
{{- end }}
{{- if and (eq $uiGatewayProtocol "HTTP") (not $allowInsecureUiHttp) }}
{{- fail "bakery.ui.gateway.listener.protocol=HTTP is not allowed by default. Use HTTPS for external Bakery UI traffic, or set bakery.ui.gateway.allowInsecureHttp=true only for isolated non-production environments." -}}
{{- end }}
{{- end }}
{{- end }}
