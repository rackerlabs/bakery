suite: bakery-ui-service
templates:
  - templates/bakery-ui-service.yaml
tests:
  - it: renders a clusterip service for the ui workload
    release:
      name: bakery
      namespace: bakery
    set:
      bakery.enabled: true
    asserts:
      - equal:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: bakery-ui
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: ui
