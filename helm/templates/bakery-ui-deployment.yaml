{{- if .Values.bakery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bakery.uiFullname" . }}
  labels:
    {{- include "bakery.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.bakery.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "bakery.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "bakery.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
        {{- include "bakery.logGroupLabel" . | nindent 8 }}
        {{- include "bakery.logRoleUi" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "bakery.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bakery-ui
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "bakery.uiImageRef" . | quote }}
          imagePullPolicy: {{ .Values.bakery.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bakery.ui.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.bakery.ui.resources | nindent 12 }}
      {{- include "bakery.podPlacement" . | nindent 6 }}
{{- end }}
