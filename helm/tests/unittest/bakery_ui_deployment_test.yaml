suite: bakery-ui-deployment
templates:
  - templates/bakery-ui-deployment.yaml
tests:
  - it: renders a separate ui deployment without api service account or db init wiring
    release:
      name: bakery
      namespace: bakery
    set:
      bakery.enabled: true
      bakery.image.pullSecrets[0]: ghcr-pull
    asserts:
      - equal:
          path: kind
          value: Deployment
      - equal:
          path: metadata.name
          value: bakery-ui
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: ui
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: ui
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: ghcr-pull
      - equal:
          path: spec.template.spec.containers[0].name
          value: bakery-ui
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - isNull:
          path: spec.template.spec.serviceAccountName
      - isNull:
          path: spec.template.spec.initContainers[0]
      - isNull:
          path: spec.template.spec.volumes[0]
