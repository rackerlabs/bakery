{{- if .Values.bakery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bakery.fullname" . }}
  labels:
    {{- include "bakery.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.bakery.service.type }}
  ports:
    - port: {{ .Values.bakery.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bakery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
