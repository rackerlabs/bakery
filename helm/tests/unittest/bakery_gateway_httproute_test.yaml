suite: bakery-gateway-httproute
templates:
  - templates/bakery-gateway-httproute.yaml
tests:
  - it: routes api and operator docs to the api service while serving the ui at root
    release:
      name: bakery
      namespace: bakery
    set:
      bakery.enabled: true
      bakery.gateway.enabled: true
      bakery.gateway.gatewayName: flex-gateway
      bakery.gateway.listener.name: bakery-https
      bakery.gateway.listener.tlsSecretName: bakery-gw-tls-secret
      bakery.gateway.hostnames[0]: bakery.example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: flex-gateway
      - equal:
          path: spec.hostnames[0]
          value: bakery.example.com
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: bakery
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: /docs
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: bakery
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: /redoc
      - equal:
          path: spec.rules[2].backendRefs[0].name
          value: bakery
      - equal:
          path: spec.rules[2].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[3].matches[0].path.type
          value: Exact
      - equal:
          path: spec.rules[3].matches[0].path.value
          value: /openapi.json
      - equal:
          path: spec.rules[3].backendRefs[0].name
          value: bakery
      - equal:
          path: spec.rules[3].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[4].matches[0].path.type
          value: Exact
      - equal:
          path: spec.rules[4].matches[0].path.value
          value: /metrics
      - equal:
          path: spec.rules[4].backendRefs[0].name
          value: bakery
      - equal:
          path: spec.rules[4].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[5].matches[0].path.type
          value: PathPrefix
      - equal:
          path: spec.rules[5].matches[0].path.value
          value: /
      - equal:
          path: spec.rules[5].backendRefs[0].name
          value: bakery-ui
      - equal:
          path: spec.rules[5].backendRefs[0].port
          value: 8080
      - isNull:
          path: spec.rules[6]
