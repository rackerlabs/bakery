nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

utilitySecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

affinity: {}

images:
  busybox: busybox:1.36
  kubectl: bitnami/kubectl:latest

mariadbOperator:
  enabled: true
  validateApis: false
  namespace: ""
  server:
    rootPassword: ""
    rootPasswordSecret: ""
    rootPasswordSecretKey: password
    image:
      repository: mariadb
      tag: "11.6"
      pullPolicy: IfNotPresent
    replicas: 1
    storage:
      size: 10Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

bakery:
  enabled: true
  replicaCount: 1

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  worker:
    enabled: true
    replicaCount: 1
    pollIntervalSec: 2
    batchSize: 10
    maxAttempts: 5
    backoffBaseSec: 5
    backoffMaxSec: 300

  dbInit:
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  image:
    repository: ghcr.io/rackerlabs/bakery
    pullPolicy: Always
    tag: ""
    digest: ""
    pullSecrets: []

  ui:
    replicaCount: 1
    publicUrl: ""
    apiBaseUrl: ""
    image:
      repository: ghcr.io/rackerlabs/bakery-ui
      pullPolicy: Always
      tag: ""
      digest: ""
    service:
      port: 8080
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    gateway:
      enabled: false
      allowInsecureHttp: false
      gatewayName: ""
      gatewayNamespace: ""
      listener:
        name: ""
        hostname: ""
        port: 443
        protocol: "HTTPS"
        tlsSecretName: ""
        allowedNamespaces: "All"
        updateIfExists: true
      hostnames: []
      annotations: {}

  service:
    type: ClusterIP
    port: 8000

  gateway:
    enabled: false
    allowInsecureHttp: false
    gatewayName: ""
    gatewayNamespace: ""
    listener:
      name: ""
      hostname: ""
      port: 443
      protocol: "HTTPS"
      tlsSecretName: ""
      allowedNamespaces: "All"
      updateIfExists: true
    hostnames: []
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3

  config:
    environment: production
    logLevel: INFO
    activeProvider: rackspace_core
    ticketingDryRun: false
    messageRetentionHours: 24
    maxMessagesPerPoll: 100
    mixerTimeoutSec: 30
    mixerMaxRetries: 3
    databasePoolSize: 20
    databasePoolMaxOverflow: 10
    databasePoolTimeout: 15

  auth:
    enabled: true
    mode: hmac
    existingSecret: ""
    secretKeys:
      activeKeyId: "active-key-id"
      activeKey: "active-key"
      nextKeyId: "next-key-id"
      nextKey: "next-key"
      monitorEncryptionKey: "monitor-encryption-key"
    hmac:
      timestampSkewSec: 300

  operatorAuth:
    enabled: true
    sessionTimeout: 86400
    oidcStateTtl: 600
    rbacEnabled: true
    serviceToken:
      existingSecret: ""
      secretKeys:
        token: "service-token"
    local:
      enabled: true
      existingSecret: ""
      secretKeys:
        username: "username"
        password: "password"
    auth0:
      enabled: false
      shared:
        domain: ""
        audience: ""
        scope: "openid profile email"
        organization: ""
        connection: ""
        usernameClaim: "email"
        displayNameClaim: "name"
        groupsClaim: "groups"
        subjectClaim: "sub"
      ui:
        enabled: false
        clientId: ""
        callbackUrl: ""
        existingSecret: ""
        secretKeys:
          clientSecret: "client-secret"
      cli:
        enabled: false
        clientId: ""
        existingSecret: ""
        secretKeys:
          clientSecret: "client-secret"
    azureAd:
      enabled: false
      shared:
        tenant: ""
        audience: ""
        scope: "openid profile email"
        usernameClaim: "preferred_username"
        displayNameClaim: "name"
        groupsClaim: "groups"
        subjectClaim: "sub"
      ui:
        enabled: false
        clientId: ""
        callbackUrl: ""
        existingSecret: ""
        secretKeys:
          clientSecret: "client-secret"
      cli:
        enabled: false
        clientId: ""

  monitoring:
    defaultKeyId: "active"
    bootstrapKeyId: "bootstrap"
    heartbeatIntervalSec: 30
    missThreshold: 5
    sweepIntervalSec: 5

  client:
    enabled: false
    enforceRemoteBaseUrl: false
    baseUrl: ""
    auth:
      mode: hmac
      existingSecret: ""
      secretKeys:
        keyId: "active-key-id"
        key: "active-key"
    requestTimeoutSeconds: 15
    maxRetries: 2
    pollIntervalSeconds: 2
    pollTimeoutSeconds: 60

  servicenow:
    existingSecret: "bakery-servicenow"
    secretKeys:
      url: "servicenow-url"
      username: "servicenow-username"
      password: "servicenow-password"

  jira:
    existingSecret: "bakery-jira"
    secretKeys:
      url: "jira-url"
      username: "jira-username"
      apiToken: "jira-api-token"

  github:
    existingSecret: "bakery-github"
    secretKeys:
      token: "github-token"

  pagerduty:
    existingSecret: "bakery-pagerduty"
    secretKeys:
      apiKey: "pagerduty-api-key"

  teams:
    existingSecret: "bakery-teams"
    secretKeys:
      webhookUrl: "teams-webhook-url"

  discord:
    existingSecret: "bakery-discord"
    secretKeys:
      webhookUrl: "discord-webhook-url"

  rackspaceCore:
    verifySsl: true
    defaultQueue: ""
    defaultSubcategory: "Monitoring"
    existingSecret: "bakery-rackspace-core"
    secretKeys:
      url: "rackspace-core-url"
      username: "rackspace-core-username"
      password: "rackspace-core-password"

  database:
    host: ""
    name: bakery
    createServer: true
    user:
      name: bakery
      password: ""
      passwordSecret: ""
      passwordSecretKey: "password"
      maxUserConnections: 150
