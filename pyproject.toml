[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bakery"
dynamic = ["version"]
description = "Standalone communication integration service for provider-native ticketing and messaging workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.7",
    "uvicorn[standard]==0.40.0",
    "sqlalchemy==2.0.46",
    "greenlet==3.2.4",
    "alembic==1.18.3",
    "pymysql==1.1.2",
    "cryptography==46.0.4",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "prometheus-client==0.24.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bakery*", "shared*"]

[tool.setuptools.dynamic]
version = {attr = "shared.version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "bakery.api.*",
    "bakery.main",
    "bakery.models",
]
disallow_untyped_defs = false
disable_error_code = ["assignment", "arg-type", "call-overload", "return-value", "var-annotated"]

[[tool.mypy.overrides]]
module = [
    "bakery.formatters",
    "bakery.worker",
    "bakery.mixer.*",
    "bakery.alembic.env",
]
disallow_untyped_defs = false
disable_error_code = [
    "assignment",
    "arg-type",
    "call-overload",
    "return-value",
    "var-annotated",
    "union-attr",
    "index",
    "no-any-return",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require running server and database)",
]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
