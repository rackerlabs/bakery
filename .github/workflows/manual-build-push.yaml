name: Manual Build and Push Artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select which artifact(s) to build and push
        type: choice
        required: true
        default: all
        options:
          - all
          - image
          - chart

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PACKAGE_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  IMAGE_NAME: ${{ format('{0}/{1}', vars.GHCR_OWNER || github.repository_owner, vars.GHCR_REPO_NAME || github.event.repository.name) }}
  CHART_PATH: helm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - id: tags
        run: echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - if: ${{ inputs.target == 'all' || inputs.target == 'image' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bakery-runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=bakery
          cache-to: type=gha,mode=max,scope=bakery
          platforms: linux/amd64

      - if: ${{ inputs.target == 'all' || inputs.target == 'image' }}
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ env.PACKAGE_OWNER }}/packages/container/${{ github.event.repository.name }} \
            -d '{"visibility":"public"}' || echo "Package may already be public or API call failed (non-fatal)"

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        id: chart_meta
        run: |
          chart_name="$(awk -F': ' '/^name:/ {print $2; exit}' "${{ env.CHART_PATH }}/Chart.yaml")"
          base_version="$(awk -F': ' '/^version:/ {print $2; exit}' "${{ env.CHART_PATH }}/Chart.yaml" | tr -d '"')"
          short_sha="${GITHUB_SHA:0:12}"
          if [[ "$base_version" == *-* ]]; then
            manual_version="${base_version}.sha.${short_sha}"
          else
            manual_version="${base_version}-sha.${short_sha}"
          fi
          echo "chart_name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "manual_version=$manual_version" >> "$GITHUB_OUTPUT"

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        run: echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        run: |
          mkdir -p .helm-packages
          helm package "${{ env.CHART_PATH }}" --version "${{ steps.chart_meta.outputs.manual_version }}" -d .helm-packages

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        run: helm push .helm-packages/*.tgz oci://${{ env.REGISTRY }}/${{ env.PACKAGE_OWNER }}/charts

      - if: ${{ inputs.target == 'all' || inputs.target == 'chart' }}
        run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ env.PACKAGE_OWNER }}/packages/container/charts%2F${{ steps.chart_meta.outputs.chart_name }} \
            -d '{"visibility":"public"}' || echo "Package may already be public or API call failed (non-fatal)"
