name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PACKAGE_OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
  IMAGE_NAME: ${{ format('{0}/{1}', vars.GHCR_OWNER || github.repository_owner, vars.GHCR_REPO_NAME || github.event.repository.name) }}
  CHART_PATH: helm

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN || secrets.CR_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: bakery-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bakery
          cache-to: type=gha,mode=max,scope=bakery
          platforms: linux/amd64

      - run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ env.PACKAGE_OWNER }}/packages/container/${{ github.event.repository.name }} \
            -d '{"visibility":"public"}' || echo "Package may already be public or API call failed (non-fatal)"

  build-and-push-chart:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    outputs:
      chart_name: ${{ steps.chart_meta.outputs.chart_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - id: chart_meta
        run: |
          chart_name="$(awk -F': ' '/^name:/ {print $2; exit}' "${{ env.CHART_PATH }}/Chart.yaml")"
          echo "chart_name=$chart_name" >> "$GITHUB_OUTPUT"

      - run: echo "${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - run: |
          mkdir -p .helm-packages
          helm package "${{ env.CHART_PATH }}" -d .helm-packages

      - run: helm push .helm-packages/*.tgz oci://${{ env.REGISTRY }}/${{ env.PACKAGE_OWNER }}/charts

      - run: |
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ env.PACKAGE_OWNER }}/packages/container/charts%2F${{ steps.chart_meta.outputs.chart_name }} \
            -d '{"visibility":"public"}' || echo "Package may already be public or API call failed (non-fatal)"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-push-image, build-and-push-chart]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ### Helm Chart
            ```bash
            helm install bakery oci://${{ env.REGISTRY }}/${{ env.PACKAGE_OWNER }}/charts/${{ needs.build-and-push-chart.outputs.chart_name }} --version ${{ github.ref_name }}
            ```
