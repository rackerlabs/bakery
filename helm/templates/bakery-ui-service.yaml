{{- if .Values.bakery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bakery.uiFullname" . }}
  labels:
    {{- include "bakery.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.bakery.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bakery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
