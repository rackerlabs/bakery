suite: bakery-api-labels
templates:
  - templates/bakery-deployment.yaml
tests:
  - it: applies bakery log labels and standalone init wiring to the api pod template
    set:
      bakery.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.labels["bakery.rackerlabs.com/log-group"]
          value: bakery
      - equal:
          path: spec.template.metadata.labels["bakery.rackerlabs.com/log-subgroup"]
          value: app
      - equal:
          path: spec.template.metadata.labels["bakery.rackerlabs.com/log-role"]
          value: api
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-db
      - isNull:
          path: spec.template.spec.initContainers[1]
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp

  - it: defaults bakery api pods to worker nodes
    set:
      bakery.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["node-role.kubernetes.io/worker"]
          value: worker
